name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify tag and release commit
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treetop-core") | .version')"
          expected_tag="v${version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}." >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit ${release_commit} is not on origin/main." >&2
            exit 1
          fi

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-features

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Verify package
        run: cargo publish --locked --dry-run

  publish:
    name: Publish treetop-core
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treetop-core") | .version')"
          if ! status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 3 \
            --retry-all-errors \
            --retry-max-time 60 \
            --connect-timeout 10 \
            --max-time 30 \
            --header 'User-Agent: treetop-core release workflow (github.com/terjekv/treetop-core)' \
            "https://crates.io/api/v1/crates/treetop-core/${version}")"; then
            echo "Could not determine whether treetop-core ${version} is published." >&2
            exit 1
          fi

          case "${status}" in
            200)
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected crates.io response ${status}; refusing to publish." >&2
              exit 1
              ;;
          esac

      - name: Authenticate to crates.io
        if: steps.published.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish treetop-core
        if: steps.published.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Report existing release
        if: steps.published.outputs.published == 'true'
        run: echo "treetop-core ${GITHUB_REF_NAME#v} is already published; nothing to do."
