name: Policy Scale

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      policy_count:
        description: Number of generated Cedar policies
        required: true
        default: "100000"
        type: string

permissions:
  contents: read

concurrency:
  group: policy-scale-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TREETOP_SCALE_POLICY_COUNT: ${{ inputs.policy_count || '100000' }}

jobs:
  scale:
    name: ${{ inputs.policy_count || '100000' }} policies
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Compile scale test
        run: cargo test --release --locked --all-features --test policy_scale --no-run

      - name: Exercise scale corpus and record peak RSS
        run: >-
          /usr/bin/time -v cargo test --release --locked --all-features
          --test policy_scale configured_policy_scale_loads_evaluates_lists_and_reloads
          -- --ignored --exact --nocapture

      - name: Benchmark scale corpus
        run: cargo bench --locked --bench policy_scale_criterion -- --noplot
